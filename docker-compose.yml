# Разработка:  docker compose up -d postgres   (сайт запускается локально: pnpm dev)
# Продакшен:   docker compose --profile prod up -d --build
name: sofario

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sofario
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sofario}
      POSTGRES_DB: sofario
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sofario -d sofario']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: [prod]
    # CD публикует образ в GitHub Container Registry; локально можно собрать: --build
    image: ${APP_IMAGE:-ghcr.io/manasars13/sofario:latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sofario:${POSTGRES_PASSWORD:-sofario}@postgres:5432/sofario
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  media:
